# ESPHome robot firmware: esp32_cam_robot v2 + esp32_cam_plugin v3 + ESP32-CAM
# Needs ESPHome 2026.x (written against 2026.7.3, like the plugin test firmware)
#
# Stack: the ESP32-CAM (AI-Thinker, OV2640, PSRAM) sits on the plugin v3
# (J4), which plugs into J2 of the robot board. Plugin "v4" is the same
# circuit migrated to KiCad 9.
#
# Pins (from the schematic / netlist nets):
#   Robot v2   TB6612FNG U1 (STBY, PWMA, PWMB tied to 3V3 -> PWM on the IN pins)
#                AI1 = GPIO13, AI2 = GPIO2   -> motor A on J1
#                BI1 = GPIO15, BI2 = GPIO14  -> motor B on J3
#              RGB chain D5->D4->D3->D2 (TX1812), DIN = GPIO12 (strapping pin)
#   Plugin v3  OLED SDA = GPIO3, SCL = GPIO1 (UART0 -> serial logging off)
#              LED D1 + module flash LED, DIN = GPIO4  -> "Headlight"
#              L9110s U1/U3 not fitted: the TB6612 is the only motor driver.
#   Not used   GPIO16 (PSRAM chip select on the AI-Thinker module; the
#              plugin's PIR and the robot's LED D1 also hang on it)
#              GPIO0 / SW1 (GPIO0 is the camera XCLK once running: don't press SW1)
#
# Driving (web page on port 80, or REST):
#   - Forward / Back / Left / Right buttons: drive for "Drive timeout" seconds,
#     press again to keep going. Stop brakes at once.
#   - Drive X / Drive Y (-100..100): joystick input for a custom page or HA.
#       curl -X POST "http://<ip>/number/drive_y/set?value=60"
#       curl -X POST "http://<ip>/number/drive_x/set?value=-30"
#     Resend at least every "Drive timeout" seconds or the robot stops.
#   - Speed (%) scales everything. Starts ramp up; stops are immediate.
# Video: http://<ip>:8080 (one viewer at a time)
#
# Safety: motors are off at boot, brake when stopped, stop when no command
# arrives in time, and stop (RGB red) when Wi-Fi or the API client drops.
# Motor B may still twitch at power-up: GPIO14/15 move during the ROM boot
# and STBY is hard-wired high, so only hardware could prevent that.

substitutions:
  name: esp32-cam-robot
  # OLED on the plugin board
  pin_sda: GPIO3
  pin_scl: GPIO1
  oled_model: "SSD1306 128x64"   # 0.91" = "SSD1306 128x32", 1.3" = "SH1106 128x64"
  oled_address: "0x3C"           # some modules use 0x3D
  # TB6612 on the robot board
  pin_motor_a_in1: GPIO13        # AI1
  pin_motor_a_in2: GPIO2         # AI2 (strapping pin)
  pin_motor_b_in1: GPIO15        # BI1 (strapping pin)
  pin_motor_b_in2: GPIO14        # BI2
  motor_pwm_freq: 5kHz
  # Which motor is which side, and whether it turns the wrong way.
  # If the robot drives backwards on Forward, flip both inverts.
  left_motor: motor_a
  right_motor: motor_b
  invert_left: "false"
  invert_right: "false"
  # Speed ramp: change per 40 ms tick. 0.10 = 0 -> 100 % in 0.4 s
  ramp_step: "0.10"
  # LEDs (TX1812 is WS2812-compatible; try SK6812 / RGB if colours are wrong)
  pin_headlight: GPIO4
  pin_rgb: GPIO12
  rgb_count: "4"
  led_chipset: WS2812
  led_rgb_order: GRB
  status_brightness: "0.3"
  # Camera: smaller frames = less lag while driving
  cam_resolution: 320x240
  cam_fps: 15 fps

esphome:
  name: ${name}
  friendly_name: ESP32-CAM robot
  on_boot:
    priority: -100
    then:
      - script.execute: stop_all
      - globals.set: { id: boot_done, value: "true" }

esp32:
  board: esp32cam
  framework:
    type: arduino

psram:

logger:
  baud_rate: 0             # GPIO1/3 are the OLED I2C bus; logs go to the web page / API
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Power saving can make the ESP32-CAM miss the WPA handshake replies
  # ("4-Way Handshake Timeout"); it also adds lag to the drive commands.
  power_save_mode: none
  # Connect straight to the SSID instead of scanning first.
  fast_connect: true
  ap:
    ssid: "${name} fallback"
  on_disconnect:
    - script.execute: link_lost_stop

captive_portal:

api:
  on_client_disconnected:
    - script.execute: link_lost_stop

ota:
  - platform: esphome

# Web page, version 3: cards in groups, colour wheel for the LEDs.
# robot_page.js adds the camera view (with a rotate button) on top.
# The page's app comes from oi.esphome.io, so the phone/PC needs internet.
# "local: true" would store it in the robot instead, but ESPHome then serves
# its own page and robot_page.js (the camera view) is never loaded.
web_server:
  port: 80
  version: 3
  js_include: "robot_page.js"
  sorting_groups:
    - id: g_drive
      name: "🚗 Drive"
      sorting_weight: 10
    - id: g_lights
      name: "🌈 Lights"
      sorting_weight: 20
    - id: g_camera
      name: "📷 Camera"
      sorting_weight: 30
    - id: g_settings
      name: "⚙️ Settings"
      sorting_weight: 40
    - id: g_health
      name: "❤️ Health"
      sorting_weight: 50

# ---------------------------------------------------------------- State
globals:
  - id: boot_done          # LEDs must not be driven before setup is finished
    type: bool
    initial_value: "false"
  - id: drive_x            # -1 (left) .. 1 (right)
    type: float
    initial_value: "0"
  - id: drive_y            # -1 (back) .. 1 (forward)
    type: float
    initial_value: "0"
  - id: cur_l              # ramped wheel outputs, -1 .. 1
    type: float
    initial_value: "0"
  - id: cur_r
    type: float
    initial_value: "0"
  - id: last_cmd           # millis() of the last drive command
    type: uint32_t
    initial_value: "0"
  - id: link_lost          # set when Wi-Fi / API dropped, cleared by the next command
    type: bool
    initial_value: "false"
  - id: status_shown       # last colour written to the RGB chain (-1 = none)
    type: int
    initial_value: "-1"
  - id: status_rgb         # that colour, to tell it apart from a user's colour
    type: std::array<float, 3>
    initial_value: "{0, 0, 0}"
  - id: dance_was_auto     # "Status LEDs auto" before the dance started
    type: bool
    initial_value: "false"

# ---------------------------------------------------------------- I2C + OLED
i2c:
  - id: oled_i2c
    sda: ${pin_sda}
    scl: ${pin_scl}
    scan: true
    frequency: 400kHz
  # Camera sensor control bus (SCCB), fixed by the ESP32-CAM board
  - id: cam_i2c
    sda: GPIO26
    scl: GPIO27
    scan: false

font:
  - file: "gfonts://Roboto"
    id: f12
    size: 12

display:
  - platform: ssd1306_i2c
    id: oled
    i2c_id: oled_i2c
    model: ${oled_model}
    address: ${oled_address}
    update_interval: 500ms
    pages:
      - id: page_network
        lambda: |-
          bool tall = it.get_height() > 32;
          it.printf(0, 0, id(f12), "WiFi %d dBm", (int) id(rssi).state);
          it.printf(0, 16, id(f12), "%s", id(ip).state.c_str());
          if (tall) {
            it.printf(0, 32, id(f12), "%s", App.get_name().c_str());
            it.printf(0, 48, id(f12), "Video :8080");
          }
      - id: page_drive
        lambda: |-
          bool tall = it.get_height() > 32;
          it.printf(0, 0, id(f12), "L %+4d%%  R %+4d%%",
                    (int) roundf(id(cur_l) * 100), (int) roundf(id(cur_r) * 100));
          const char *st = id(link_lost) ? "STOP: link lost"
                         : (id(cur_l) != 0 || id(cur_r) != 0) ? "Driving" : "Ready";
          it.printf(0, 16, id(f12), "%s", st);
          if (tall) {
            it.printf(0, 32, id(f12), "Speed %d%%", (int) id(speed_pct).state);
            int s = (int) id(up).state;
            it.printf(0, 48, id(f12), "Up %02d:%02d:%02d", s / 3600, (s / 60) % 60, s % 60);
          }

# ---------------------------------------------------------------- Motors
# Channels 2-5 keep the LEDC away from channel/timer 0 used by the camera XCLK.
output:
  - platform: ledc
    id: motor_a_in1
    pin: ${pin_motor_a_in1}
    channel: 2
    frequency: ${motor_pwm_freq}
  - platform: ledc
    id: motor_a_in2
    pin:
      number: ${pin_motor_a_in2}
      ignore_strapping_warning: true
    channel: 3
    frequency: ${motor_pwm_freq}
  - platform: ledc
    id: motor_b_in1
    pin:
      number: ${pin_motor_b_in1}
      ignore_strapping_warning: true
    channel: 4
    frequency: ${motor_pwm_freq}
  - platform: ledc
    id: motor_b_in2
    pin: ${pin_motor_b_in2}
    channel: 5
    frequency: ${motor_pwm_freq}

# Internal: the drive loop below owns the motors and would undo manual changes.
fan:
  - platform: hbridge
    id: motor_a
    internal: true
    pin_a: motor_a_in1
    pin_b: motor_a_in2
    decay_mode: slow
    restore_mode: ALWAYS_OFF
  - platform: hbridge
    id: motor_b
    internal: true
    pin_a: motor_b_in1
    pin_b: motor_b_in2
    decay_mode: slow
    restore_mode: ALWAYS_OFF

interval:
  # Drive loop: watchdog, joystick mix, speed scaling, ramp, write motors
  - interval: 40ms
    then:
      - lambda: |-
          if (!id(boot_done)) return;
          float x = id(drive_x), y = id(drive_y);
          if ((x != 0 || y != 0) &&
              millis() - id(last_cmd) > (uint32_t) (id(drive_timeout_s).state * 1000)) {
            ESP_LOGI("drive", "No command for %.1f s: stop", id(drive_timeout_s).state);
            id(stop_all).execute();
            return;
          }
          // Differential mix, then scale by the Speed slider
          float l = y + x, r = y - x;
          float m = std::max(fabsf(l), fabsf(r));
          if (m > 1) { l /= m; r /= m; }
          float k = id(speed_pct).state / 100.0f;
          l *= k; r *= k;
          // Ramp up only: slowing down, stopping and reversing are immediate
          // (a reversal drops to 0 first, then ramps up the other way)
          const float step = ${ramp_step};
          auto ramp = [step](float cur, float tgt) -> float {
            if (tgt == 0 || cur * tgt < 0) cur = 0;
            if (fabsf(tgt) <= fabsf(cur)) return tgt;
            return tgt > cur ? std::min(cur + step, tgt) : std::max(cur - step, tgt);
          };
          id(cur_l) = ramp(id(cur_l), l);
          id(cur_r) = ramp(id(cur_r), r);
          // Write a motor only when its speed or direction changed
          auto apply = [](fan::Fan *mot, float v) {
            int sp = (int) roundf(fabsf(v) * 100);
            if (sp == 0) {
              if (mot->state) { auto c = mot->turn_off(); c.perform(); }
              return;
            }
            auto dir = v > 0 ? fan::FanDirection::FORWARD : fan::FanDirection::REVERSE;
            if (mot->state && mot->speed == sp && mot->direction == dir) return;
            auto c = mot->turn_on();
            c.set_speed(sp);
            c.set_direction(dir);
            c.perform();
          };
          apply(id(${left_motor}),  ${invert_left}  ? -id(cur_l) : id(cur_l));
          apply(id(${right_motor}), ${invert_right} ? -id(cur_r) : id(cur_r));

  # Status colour on the robot's RGB chain (only written when it changes)
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(boot_done) || !id(status_auto).state) return;
          int s;
          if (!wifi::global_wifi_component->is_connected()) s = 0;   // blue
          else if (id(link_lost))                         s = 1;   // red
          else if (id(cur_l) != 0 || id(cur_r) != 0)      s = 2;   // amber
          else                                            s = 3;   // green
          if (s == id(status_shown)) return;
          id(status_shown) = s;
          static const float col[4][3] = {{0, 0, 1}, {1, 0, 0}, {1, 0.45, 0}, {0, 1, 0}};
          id(status_rgb) = {col[s][0], col[s][1], col[s][2]};
          auto call = id(rgb_chain).turn_on();
          call.set_effect("None");
          call.set_rgb(col[s][0], col[s][1], col[s][2]);
          call.set_brightness(${status_brightness});
          call.set_transition_length(0);
          call.perform();

  # Alternate OLED pages
  - interval: 4s
    then:
      - display.page.show_next: oled
      - component.update: oled

script:
  - id: drive
    mode: restart
    parameters:
      x: float
      y: float
    then:
      - lambda: |-
          id(drive_x) = std::max(-1.0f, std::min(1.0f, x));
          id(drive_y) = std::max(-1.0f, std::min(1.0f, y));
          id(last_cmd) = millis();
          id(link_lost) = false;

  # Stop now and hold the brake (TB6612: both IN pins high = short brake)
  - id: stop_all
    mode: restart
    then:
      - script.stop: dance
      - lambda: |-
          id(drive_x) = 0; id(drive_y) = 0;
          id(cur_l) = 0;   id(cur_r) = 0;
          if (id(num_drive_x).state != 0) id(num_drive_x).publish_state(0);
          if (id(num_drive_y).state != 0) id(num_drive_y).publish_state(0);
      - fan.turn_off: motor_a
      - fan.turn_off: motor_b
      - fan.hbridge.brake: motor_a
      - fan.hbridge.brake: motor_b

  - id: link_lost_stop
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(drive_x) != 0 || id(drive_y) != 0 || id(cur_l) != 0 || id(cur_r) != 0;"
          then:
            - logger.log:
                level: WARN
                format: "Link lost while driving: stop"
            - globals.set: { id: link_lost, value: "true" }
      - script.execute: stop_all

  # Wiggle left/right for 3 s with rainbow LEDs. Each step is a normal drive
  # command, so Speed, the watchdog and Stop all still apply.
  - id: dance
    mode: single
    then:
      - lambda: |-
          id(dance_was_auto) = id(status_auto).state;
          id(status_auto).publish_state(false);   // take the LEDs without turning them off
          auto call = id(rgb_chain).turn_on();
          call.set_brightness(0.6);
          call.set_effect("Rainbow");
          call.perform();
      - repeat:
          count: 6
          then:
            - script.execute: { id: drive, x: -1, y: 0 }
            - delay: 250ms
            - script.execute: { id: drive, x: 1, y: 0 }
            - delay: 250ms
      - if:
          condition:
            lambda: "return id(dance_was_auto);"
          then:
            - switch.turn_on: status_auto
          else:
            - light.turn_off: rgb_chain
      - script.execute: stop_all

# ---------------------------------------------------------------- Controls
button:
  - platform: template
    name: "Forward"
    web_server: { sorting_group_id: g_drive, sorting_weight: 1 }
    icon: mdi:arrow-up-bold
    on_press:
      - script.execute:
          id: drive
          x: 0
          y: 1
  - platform: template
    name: "Back"
    web_server: { sorting_group_id: g_drive, sorting_weight: 2 }
    icon: mdi:arrow-down-bold
    on_press:
      - script.execute:
          id: drive
          x: 0
          y: -1
  - platform: template
    name: "Left"
    web_server: { sorting_group_id: g_drive, sorting_weight: 3 }
    icon: mdi:rotate-left
    on_press:
      - script.execute:
          id: drive
          x: -1
          y: 0
  - platform: template
    name: "Right"
    web_server: { sorting_group_id: g_drive, sorting_weight: 4 }
    icon: mdi:rotate-right
    on_press:
      - script.execute:
          id: drive
          x: 1
          y: 0
  - platform: template
    name: "Stop"
    web_server: { sorting_group_id: g_drive, sorting_weight: 5 }
    icon: mdi:stop
    on_press:
      - script.execute: stop_all
  - platform: template
    name: "Dance"
    web_server: { sorting_group_id: g_drive, sorting_weight: 6 }
    icon: mdi:human-handsup
    on_press:
      - script.execute: dance
  - platform: restart
    name: "Restart"
    web_server: { sorting_group_id: g_settings, sorting_weight: 9 }

number:
  - platform: template
    id: speed_pct
    name: "Speed"
    web_server: { sorting_group_id: g_drive, sorting_weight: 7 }
    icon: mdi:speedometer
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 100
    step: 5
    initial_value: 60
  - platform: template
    id: drive_timeout_s
    name: "Drive timeout"
    web_server: { sorting_group_id: g_settings, sorting_weight: 1 }
    icon: mdi:timer-stop
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.3
    max_value: 5
    step: 0.1
    initial_value: 1
  - platform: template
    id: num_drive_x
    name: "Drive X"
    web_server: { sorting_group_id: g_drive, sorting_weight: 20 }
    mode: slider
    optimistic: true
    min_value: -100
    max_value: 100
    step: 5
    initial_value: 0
    set_action:
      - script.execute:
          id: drive
          x: !lambda "return x / 100.0f;"
          y: !lambda "return id(drive_y);"
  - platform: template
    id: num_drive_y
    name: "Drive Y"
    web_server: { sorting_group_id: g_drive, sorting_weight: 21 }
    mode: slider
    optimistic: true
    min_value: -100
    max_value: 100
    step: 5
    initial_value: 0
    set_action:
      - script.execute:
          id: drive
          x: !lambda "return id(drive_x);"
          y: !lambda "return x / 100.0f;"

select:
  # Quick speed choice; the Speed slider still allows anything in between
  - platform: template
    name: "Speed preset"
    web_server: { sorting_group_id: g_drive, sorting_weight: 8 }
    icon: mdi:speedometer-medium
    optimistic: true
    options: ["Slow 🐢", "Normal", "Turbo 🚀"]
    initial_option: "Normal"
    set_action:
      - lambda: |-
          float v = x == "Slow 🐢" ? 35 : x == "Turbo 🚀" ? 100 : 60;
          auto call = id(speed_pct).make_call();
          call.set_value(v);
          call.perform();
  # One click colours for the RGB LEDs (no colour wheel needed)
  - platform: template
    id: led_preset
    name: "LED colour"
    web_server: { sorting_group_id: g_lights, sorting_weight: 2 }
    icon: mdi:palette
    optimistic: true
    options: ["Off", "Red", "Orange", "Yellow", "Green", "Cyan", "Blue", "Purple", "Pink", "White"]
    initial_option: "Off"
    set_action:
      - lambda: |-
          static const struct { const char *n; float r, g, b; } cols[] = {
            {"Red", 1, 0, 0},    {"Orange", 1, 0.35, 0}, {"Yellow", 1, 0.8, 0},
            {"Green", 0, 1, 0},  {"Cyan", 0, 1, 1},      {"Blue", 0, 0, 1},
            {"Purple", 0.6, 0, 1}, {"Pink", 1, 0.2, 0.6}, {"White", 1, 1, 1}};
          id(status_auto).publish_state(false);   // keep the status colours away
          if (x == "Off") { auto c = id(rgb_chain).turn_off(); c.perform(); return; }
          for (auto &c : cols) {
            if (x != c.n) continue;
            auto call = id(rgb_chain).turn_on();
            call.set_effect("None");
            call.set_rgb(c.r, c.g, c.b);
            call.set_brightness(0.6);
            call.perform();
          }

switch:
  - platform: template
    id: status_auto
    name: "Status LEDs auto"
    web_server: { sorting_group_id: g_lights, sorting_weight: 1 }
    icon: mdi:led-on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - globals.set: { id: status_shown, value: "-1" }
    turn_off_action:
      - light.turn_off: rgb_chain
  # Camera orientation, depending on how the module is mounted
  - platform: template
    name: "Cam vertical flip"
    web_server: { sorting_group_id: g_camera, sorting_weight: 1 }
    optimistic: true
    restore_mode: ALWAYS_OFF          # must match vertical_flip below
    turn_on_action:
      - lambda: 'sensor_t *s = esp_camera_sensor_get(); if (s) s->set_vflip(s, 1);'
    turn_off_action:
      - lambda: 'sensor_t *s = esp_camera_sensor_get(); if (s) s->set_vflip(s, 0);'
  - platform: template
    name: "Cam horizontal mirror"
    web_server: { sorting_group_id: g_camera, sorting_weight: 2 }
    optimistic: true
    restore_mode: ALWAYS_OFF          # must match horizontal_mirror below
    turn_on_action:
      - lambda: 'sensor_t *s = esp_camera_sensor_get(); if (s) s->set_hmirror(s, 1);'
    turn_off_action:
      - lambda: 'sensor_t *s = esp_camera_sensor_get(); if (s) s->set_hmirror(s, 0);'

# ---------------------------------------------------------------- LEDs
light:
  # Plugin LED D1; the module's white flash LED hangs on the same line
  - platform: esp32_rmt_led_strip
    id: headlight
    name: "Headlight"
    web_server: { sorting_group_id: g_lights, sorting_weight: 10 }
    icon: mdi:car-light-high
    pin: ${pin_headlight}
    num_leds: 1
    chipset: ${led_chipset}
    rgb_order: ${led_rgb_order}
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
  # Robot board D2-D5. Shows the status colour while "Status LEDs auto" is on.
  # Any colour, effect or on/off chosen by hand turns "Status LEDs auto" off
  # (see on_state); turn it back on to get the status colours again.
  - platform: esp32_rmt_led_strip
    id: rgb_chain
    name: "RGB LEDs"
    web_server: { sorting_group_id: g_lights, sorting_weight: 3 }
    pin:
      number: ${pin_rgb}
      ignore_strapping_warning: true
    num_leds: ${rgb_count}
    chipset: ${led_chipset}
    rgb_order: ${led_rgb_order}
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          width: 8
      - addressable_color_wipe:
          name: "Colour wipe"
          add_led_interval: 120ms
      - addressable_scan:
          name: "Scanner"
          move_interval: 120ms
      - addressable_twinkle:
          name: "Twinkle"
      - addressable_fireworks:
          name: "Fireworks"
      - addressable_lambda:
          name: "Police"
          update_interval: 150ms
          lambda: |-
            static bool flip = false;
            flip = !flip;
            for (int i = 0; i < it.size(); i++) {
              bool left = i < it.size() / 2;
              it[i] = (left == flip) ? Color(255, 0, 0) : Color(0, 0, 255);
            }
      - strobe:
          name: "Strobe"
          colors:
            - state: true
              brightness: 100%
              duration: 80ms
            - state: false
              duration: 120ms
      - pulse:
          name: "Pulse"
          transition_length: 1s
          update_interval: 1s
    # The status loop writes exactly status_rgb at status_brightness with no
    # effect. Anything else came from a person: let them keep it.
    on_state:
      - lambda: |-
          if (!id(boot_done) || !id(status_auto).state || id(status_shown) < 0) return;
          auto &v = id(rgb_chain).remote_values;
          auto near = [](float a, float b) { return fabsf(a - b) < 0.02f; };
          bool ours = v.is_on() && id(rgb_chain).get_current_effect_index() == 0 &&
                      near(v.get_brightness(), ${status_brightness}) &&
                      near(v.get_red(), id(status_rgb)[0]) &&
                      near(v.get_green(), id(status_rgb)[1]) &&
                      near(v.get_blue(), id(status_rgb)[2]);
          if (!ours) {
            ESP_LOGI("leds", "LEDs set by hand: Status LEDs auto off");
            id(status_auto).publish_state(false);
          }

# ---------------------------------------------------------------- Health
sensor:
  - platform: wifi_signal
    id: rssi
    name: "Wi-Fi RSSI"
    web_server: { sorting_group_id: g_health, sorting_weight: 1 }
    update_interval: 10s
  - platform: uptime
    id: up
    name: "Uptime"            # drops to 0 after a brownout reset
    web_server: { sorting_group_id: g_health, sorting_weight: 2 }
    update_interval: 10s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip
      name: "IP"
      web_server: { sorting_group_id: g_health, sorting_weight: 3 }
  - platform: version
    name: "ESPHome version"
    web_server: { sorting_group_id: g_health, sorting_weight: 4 }

# ---------------------------------------------------------------- Camera
esp32_camera:
  name: "Camera"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_id: cam_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: ${cam_resolution}
  jpeg_quality: 12          # 10 = best ... 63 = smallest/fastest
  vertical_flip: false
  horizontal_mirror: false
  max_framerate: ${cam_fps}
  idle_framerate: 0.1 fps

esp32_camera_web_server:
  - port: 8080
    mode: stream            # http://<ip>:8080
