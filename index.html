<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki — Personal Notes Index</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #161a22;
    --accent: #4f8cff;
    --accent2: #ffb454;
    --text: #e6e8ee;
    --muted: #9aa4b2;
    --border: #262b36;
    --success: #3ddc97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 56px 24px 36px;
    text-align: center;
    background: radial-gradient(ellipse at top, #1b2130 0%, var(--bg) 70%);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 2.2rem;
    background: linear-gradient(90deg, var(--accent), var(--success));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin: 0; }
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 26px;
    margin-bottom: 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 1.15rem;
    color: var(--accent);
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.72rem;
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(79,140,255,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 24px;
  }
</style>
</head>
<body>

<header>
  <h1>Wiki</h1>
  <p>Index of personal notes and how-to guides</p>
</header>

<div class="container">

  <a class="card" href="windows-ubuntu-file-sharing-tutorial.html">
    <h2>Sharing Files Between Ubuntu &amp; Windows 11</h2>
    <p>Step-by-step guide to setting up SMB file sharing in both directions on a local network, plus RDP and troubleshooting notes.</p>
    <span class="tag">networking</span>
  </a>

</div>

<footer>
  More guides will be added here over time.
</footer>

</body>
</html>
